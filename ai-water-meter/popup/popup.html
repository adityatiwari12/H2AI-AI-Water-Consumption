<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="awm-popup">
    <div class="awm-popup-header">
      <div class="awm-popup-brand">
        <svg class="awm-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C12 2 5 11.5 5 15.5C5 19.6 8.4 23 12 23C15.6 23 19 19.6 19 15.5C19 11.5 12 2 12 2Z" fill="#2f7fed"/>
          <path d="M8.5 16.5C8.5 18.5 9.9 20 12 20" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <div>
          <div class="awm-popup-title">H2<span class="awm-accent">AI</span></div>
          <a class="awm-popup-sub awm-popup-by" href="https://www.tokenistt.com" target="_blank" rel="noopener">
            by <img src="../icons/tokenistt-logo.png" alt="tokenistt" class="awm-tokenistt-logo" /> tokenistt
          </a>
        </div>
      </div>
      <div class="awm-popup-header-actions">
        <button type="button" class="awm-icon-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 0 1 13.66-5.66M20 12a8 8 0 0 1-13.66 5.66" stroke="#2f7fed" stroke-width="2" stroke-linecap="round"/><path d="M17 4v4h-4M7 20v-4h4" stroke="#2f7fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="awm-icon-btn" title="More" aria-label="More">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="5" r="1.6" fill="#8a92a3"/><circle cx="12" cy="12" r="1.6" fill="#8a92a3"/><circle cx="12" cy="19" r="1.6" fill="#8a92a3"/></svg>
        </button>
      </div>
    </div>

    <div class="awm-popup-hero">
      <svg class="awm-hero-drop" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="55" rx="16" ry="3" fill="#2f7fed" opacity="0.15"/>
        <path d="M32 4C32 4 12 30 12 42C12 53.05 20.95 60 32 60C43.05 60 52 53.05 52 42C52 30 32 4 32 4Z" fill="url(#awmDropGrad)"/>
        <ellipse cx="26" cy="36" rx="5" ry="8" fill="#ffffff" opacity="0.35"/>
        <defs>
          <linearGradient id="awmDropGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5ea6ff"/>
            <stop offset="1" stop-color="#2464d6"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="awm-popup-hero-body">
        <div class="awm-popup-hero-label">Lifetime Water <span class="awm-info" title="Estimated from response length, not measured by any provider.">i</span></div>
        <div class="awm-popup-hero-value"><span id="totalWaterNum">—</span><span class="awm-popup-hero-unit" id="totalWaterUnit"></span></div>
        <div class="awm-popup-hero-sub">Your estimated water footprint</div>
      </div>
    </div>

    <div class="awm-popup-statrow">
      <div class="awm-popup-stat">
        <div class="awm-popup-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C12 2 6 10 6 14.5C6 18.09 8.69 21 12 21C15.31 21 18 18.09 18 14.5C18 10 12 2 12 2Z" fill="#2f7fed"/></svg>
        </div>
        <div class="awm-popup-stat-label">Lifetime Cost <span class="awm-info" title="Estimated cost, not billed provider data.">i</span></div>
        <div class="awm-popup-stat-value" id="totalCost">—</div>
        <div class="awm-popup-stat-sub">Estimated cost</div>
      </div>
      <div class="awm-popup-stat">
        <div class="awm-popup-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4a1 1 0 0 1-1-1V5Z" fill="#2f7fed"/></svg>
        </div>
        <div class="awm-popup-stat-label">Chats Processed <span class="awm-info" title="Total responses counted across all sites.">i</span></div>
        <div class="awm-popup-stat-value" id="totalChats">—</div>
        <div class="awm-popup-stat-sub">Total conversations</div>
      </div>
    </div>

    <div class="awm-popup-tabs" id="breakdownTabs">
      <button type="button" class="awm-popup-tab" data-tab="site">By Site</button>
      <button type="button" class="awm-popup-tab" data-tab="model">By Model</button>
    </div>

    <div class="awm-popup-sites" id="siteBreakdown"></div>
    <div class="awm-popup-sites" id="modelBreakdown" style="display:none"></div>

    <button id="resetBtn" class="awm-popup-reset">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 0 1 13.66-5.66M20 12a8 8 0 0 1-13.66 5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 4v4h-4M7 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reset all stats
    </button>

    <div class="awm-popup-footnote">
      Numbers are estimates from response length, not real provider data.<br />
      Free &amp; open-source, built by <a href="https://www.tokenistt.com" target="_blank" rel="noopener">tokenistt</a>.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
